# Code scanning do CodeQL (GitHub Actions), como workflow do repositorio e nao como o
# "default setup" do GitHub: o default roda num rotulo de runner que o repositorio nao
# controla, a versao do CodeQL fica a cargo do GitHub e o repositorio nao mostra que a
# analise existe. Aqui o runner e fixo como nos outros workflows, as Actions sao fixadas
# por SHA (o Dependabot as atualiza) e um job travado pode ser re-executado. Os alertas
# aparecem na aba Security do repositorio.
#
# Um job por linguagem, cada um com a propria categoria, para os alertas nao se misturarem:
#   actions                  os proprios workflows de .github/workflows/
#   javascript-typescript    o static/js/ (interacoes.js) e o resumo do Lighthouse
#   python                   o projeto Django inteiro
# Nenhum precisa de build (`build-mode: none`): o CodeQL le o codigo-fonte.
#
# As Actions ficam fixadas pelo SHA do commit, com a versao no comentario: uma tag pode ser
# movida para outro commit, o SHA nao.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Semanal, domingo as 12:00 UTC (09:00 em Sao Paulo, junto do Dependabot): consultas novas
  # chegam ao pacote do CodeQL sem mudanca no repositorio.
  schedule:
    - cron: "0 12 * * 0"

# So leitura por padrao; o job de analise pede o unico escopo a mais de que precisa.
permissions:
  contents: read

# Um push novo no mesmo PR deixa a analise anterior sem sentido; na main e no agendamento
# todo run e mantido, para nenhum resultado se perder.
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-26.04
    # Um run leva poucos minutos; o teto evita que um job travado gaste a cota.
    timeout-minutes: 30
    permissions:
      contents: read
      # Envia o resultado (SARIF) para a aba Security.
      security-events: write
    strategy:
      # Uma linguagem com problema nao derruba a analise das outras.
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python]
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nenhum passo seguinte usa o token do GitHub; ele nao fica no disco.
          persist-credentials: false

      - name: Iniciar o CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analisar
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
