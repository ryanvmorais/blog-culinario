# CI — espelha o portão de qualidade local (ruff -> black -> mypy -> pytest,
# ver "Qualidade e testes" no README). Roda em todo push/PR para pegar regressão
# antes do merge.
#
# O piso do projeto e o 3.12 (a versao do servidor no PythonAnywhere, que lista
# Python so ate o 3.13); o 3.14 e a versao estavel mais nova. A matriz testa as
# duas pontas, para o piso declarado no pyproject.toml nao ser so uma promessa.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Lint, tipos e testes (Python ${{ matrix.python-version }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nenhum passo seguinte precisa do token do GitHub; ele não fica no disco.
          persist-credentials: false

      - name: Instalar uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Instalar dependências
        run: uv sync --all-extras --dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Formatação (black)
        run: uv run black --check .

      - name: Tipos (mypy)
        run: uv run mypy .

      - name: Testes (pytest)
        run: uv run pytest
