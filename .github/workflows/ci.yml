# CI — espelha o portão de qualidade local (ruff -> black -> mypy -> pytest,
# ver "Qualidade e testes" no README). Roda em todo push/PR para pegar regressão
# antes do merge.
#
# O piso do projeto é o 3.12, o mínimo do Django 6.1. A matriz testa todas as
# versões que o Django 6.1 suporta (3.12 a 3.15), para o piso declarado no
# pyproject.toml não ser só uma promessa e o 3.15 não chegar sem teste.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Lint, tipos e testes (Python ${{ matrix.python-version }})
    runs-on: ubuntu-26.04
    # A suíte roda em menos de 1 minuto; o teto só corta um run travado.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nenhum passo seguinte precisa do token do GitHub; ele não fica no disco.
          persist-credentials: false

      - name: Instalar uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Instalar dependências
        run: uv sync --all-extras --dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Formatação (black)
        run: uv run black --check .

      - name: Tipos (mypy)
        run: uv run mypy .

      - name: Testes (pytest)
        run: uv run pytest
