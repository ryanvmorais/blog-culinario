# =============================================================================
# Configuração do projeto (PEP 621) — gerenciado com uv.
#
#   [project]            metadados + dependências de runtime
#   [dependency-groups]  dev    lint / tipos / testes
#   [tool.*]             ruff, black, mypy, pytest
#
# Versões exatas de todo o grafo ficam fixadas no uv.lock (`uv lock`); as
# linhas aqui são só o piso mínimo.
# =============================================================================

[project]
name = "blog-culinario"
version = "0.1.0"
description = "Blog culinário multipáginas em Django — projeto educacional para aprender a construir aplicações web com Python."
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.2",
    "django-environ>=0.14.0",
    "pillow>=13.0.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "django-stubs>=6.1.2",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.17.2",
]

# --- Lint (ruff, substitui flake8 + isort) ----------------------------------
[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["**/migrations/*.py"]  # geradas pelo Django, não seguem o estilo do projeto

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "D", "D213"]  # pyflakes+pycodestyle, isort, pyupgrade, bugbear, simplify, comprehensions, ruff-native, pydocstyle (D213 pelo nome: a convenção Google o desliga)
ignore = [
    "RUF012",  # list/dict em ModelAdmin e Model.Meta são a convenção do próprio Django, não um bug
    "D1",  # docstring ausente (D100 a D107) fica fora do portão por enquanto; tire daqui conforme cada módulo for documentado
    "D212",  # o estilo do projeto abre a docstring com `"""` sozinho e o resumo na linha seguinte (D213)
    "D205",  # o resumo pode ser um parágrafo que quebra linha, seguido de linha em branco
]

[tool.ruff.lint.isort]
known-first-party = ["blog_culinario", "nucleo", "receitas", "usuarios"]

[tool.ruff.lint.pydocstyle]
# Seções no estilo Google (`Args:`, `Returns:`, `Raises:`), como nas docstrings.
convention = "google"

# --- Formatador (black) ------------------------------------------------------
[tool.black]
line-length = 88
target-version = ["py312"]
extend-exclude = "migrations/"

# --- Type checker (mypy + django-stubs) --------------------------------------
[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
exclude = ["migrations/"]

[tool.django-stubs]
django_settings_module = "blog_culinario.settings.dev"

[[tool.mypy.overrides]]
module = "environ"  # django-environ não publica stubs nem py.typed
ignore_missing_imports = true

# --- Testes (pytest + pytest-django) -----------------------------------------
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "blog_culinario.settings.dev"
python_files = ["tests.py", "test_*.py"]
